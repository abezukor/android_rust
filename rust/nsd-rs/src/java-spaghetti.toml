
include = [
    "com/maticrobots/nsd_rs/*",

    "android/net/nsd/*",
    "android/net/Network",
    "android/content/Context",
    "android/os/Build$VERSION",

    "java/lang/Object",
    "java/lang/Throwable",
    "java/lang/StackTraceElement",
    "java/lang/String",
    "java/lang/ClassLoader",

    "java/net/InetAddress",

    "java/util/concurrent/Executor",
    "java/util/Collection",
    "java/util/Iterator",
    "java/util/Map",
    "java/util/Map$Entry",
    "java/util/Set",

    "androidx/annotation/NonNull",
    "androidx/annotation/RequiresApi",
]

[[documentation.pattern]]
class_url_pattern = "https://developer.android.com/reference/{CLASS}.html"
method_url_pattern = "https://developer.android.com/reference/{CLASS}.html#{METHOD}({ARGUMENTS})"
constructor_url_pattern = "https://developer.android.com/reference/{CLASS}.html#{CLASS.INNER}({ARGUMENTS})"
field_url_pattern = "https://developer.android.com/reference/{CLASS}.html#{FIELD}"
argument_seperator = ",%20"


[logging]
verbose = true

[input]
files = [
    # TODO Make this respect environment variables
    "/home/abe/Android/Sdk/platforms/android-35/android.jar",
    # Hack so we can use android studio (as opposed to raw javac) to build the jar files.
    # Technically this may change, but I (Abe) think that is unlikely.
    "../../../java/nsd_rs/build/intermediates/full_jar/debug/createFullJarDebug/full.jar",
]

[output]
path = "bindings.rs"

[codegen]
method_naming_style = "java"
method_naming_style_collision = "java_short_signature"
keep_rejected_emits = false

[codegen.field_naming_style]
const_finals = true
rustify_names = false
getter_pattern = "{NAME}"
setter_pattern = "set_{NAME}"
